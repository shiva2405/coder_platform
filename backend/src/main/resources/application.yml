server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: simplycode

# Code execution configuration
execution:
  timeout: ${EXECUTION_TIMEOUT:30000}            # 30 seconds in milliseconds
  memory-limit: ${EXECUTION_MEMORY_LIMIT:134217728}   # 128MB in bytes
  max-output-size: ${EXECUTION_MAX_OUTPUT_SIZE:65536}    # 64KB output limit
  temp-directory: ${EXECUTION_TEMP_DIR:/tmp/simplycode}

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,OPTIONS
  allowed-headers: "*"

logging:
  level:
    com.coderplatform: ${LOG_LEVEL:INFO}
    root: INFO

# Management endpoints for Azure health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
