server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: coder-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coder_platform}
    username: ${SPRING_DATASOURCE_USERNAME:coder}
    password: ${SPRING_DATASOURCE_PASSWORD:coder}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# Snippet persistence
snippet:
  max-code-bytes: 262144          # 256KB
  max-title-length: 200
  rate-limit-per-hour: 20
  slug-length: 8

# Code execution configuration
execution:
  timeout: 30000            # 30 seconds in milliseconds
  memory-limit: 134217728   # 128MB in bytes (enough for JVM languages to start)
  max-output-size: 65536    # 64KB output limit
  max-concurrent-live: 32
  temp-directory: /tmp/coder-platform

# Admin APIs (X-Admin-Key)
admin:
  api-key: ${ADMIN_API_KEY:dev-admin-key}

# CORS configuration
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"

logging:
  level:
    com.coderplatform: DEBUG
    root: INFO
