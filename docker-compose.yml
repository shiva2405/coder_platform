version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coder_platform
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - coder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - coder-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx4g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      - EXECUTION_TIMEOUT=30000
      - EXECUTION_MEMORY_LIMIT=134217728
      - EXECUTION_MAX_OUTPUT_SIZE=65536
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/coder_platform
      - SPRING_DATASOURCE_USERNAME=coder
      - SPRING_DATASOURCE_PASSWORD=coder
      - AUTH_LOCAL_ENABLED=true
      - FRONTEND_BASE_URL=http://localhost:3000
      - AUTH_ADMIN_EMAILS=admin@localhost
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3000/api/auth/github/callback}
      # Thread pool settings for high concurrency
      - SERVER_TOMCAT_THREADS_MAX=400
      - SERVER_TOMCAT_THREADS_MIN_SPARE=50
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /tmp/coder-platform:/tmp/coder-platform
    restart: unless-stopped
    networks:
      - coder-network
    # Optimized for 16GB RAM - use most for execution
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 14G
        reservations:
          cpus: '2'
          memory: 4G

networks:
  coder-network:
    driver: bridge

volumes:
  postgres-data:
