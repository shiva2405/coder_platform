# SimplyCode Azure Deployment Pipeline
# Triggers on push to main branch
# Builds and deploys both frontend and backend to Azure Container Apps

name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  AZURE_RESOURCE_GROUP: simplycode-rg
  AZURE_CONTAINER_REGISTRY: simplycodeacr
  AZURE_CONTAINER_APP_ENV: simplycode-env
  BACKEND_APP_NAME: simplycode-backend
  FRONTEND_APP_NAME: simplycode-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Get ACR Login Server
        id: acr
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name ${{ env.AZURE_CONTAINER_REGISTRY }} --query loginServer -o tsv)
          echo "login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT

      # Build and push Backend
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/simplycode-backend:${{ github.sha }},${{ steps.acr.outputs.login_server }}/simplycode-backend:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Build and push Frontend
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./azure/Dockerfile.frontend.prebuilt
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/simplycode-frontend:${{ github.sha }},${{ steps.acr.outputs.login_server }}/simplycode-frontend:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy Backend to Azure Container Apps
      - name: Deploy Backend to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ steps.acr.outputs.login_server }}/simplycode-backend:${{ github.sha }}

      # Get Backend URL for Frontend config
      - name: Get Backend URL
        id: backend
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$BACKEND_FQDN" >> $GITHUB_OUTPUT

      # Deploy Frontend to Azure Container Apps
      - name: Deploy Frontend to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ steps.acr.outputs.login_server }}/simplycode-frontend:${{ github.sha }} \
            --set-env-vars "BACKEND_URL=${{ steps.backend.outputs.url }}"

      # Get Frontend URL
      - name: Get Frontend URL
        id: frontend
        run: |
          FRONTEND_FQDN=$(az containerapp show \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FRONTEND_FQDN" >> $GITHUB_OUTPUT

      # Update CORS for Backend
      - name: Update Backend CORS
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --set-env-vars "CORS_ALLOWED_ORIGINS=${{ steps.frontend.outputs.url }},http://localhost:3000,http://localhost:5173"

      - name: Deployment Summary
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL:** ${{ steps.frontend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend URL:** ${{ steps.backend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
